name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Test
      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: recording-folder-dock-windows-x64
          path: dist/recording-folder-dock-windows-x64.zip
          if-no-files-found: error
